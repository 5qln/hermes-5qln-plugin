name: 5qln
version: 0.6.0
description: 5QLN language runtime for Hermes Agent — constitutional grammar activation, formation cycle engine, conversion pipeline, and experimental features. Skills auto-seed into the skill index on install so they appear in /skills and the agent prompt without manual tap configuration.
provides_tools:
  - fiveqln_inventory_source
  - fiveqln_create_manifest
  - fiveqln_compile_manifest
  - fiveqln_validate_research_prompt
  - fiveqln_fractal_memory
  - fiveqln_create_skill_manifest
  - fiveqln_verify_skill
provides_hooks:
  - pre_llm_call
