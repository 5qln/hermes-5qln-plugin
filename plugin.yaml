name: 5qln
version: 0.12.0
description: 5QLN language runtime for Hermes Agent — deterministic conversion tools, a self-contained minimum cycle engine (xyzab + structural decoding + phase log), skill formation, and clearly marked experimental guides. Skills auto-seed into the skill index on install.
provides_tools:
  - fiveqln_inventory_source
  - fiveqln_create_manifest
  - fiveqln_compile_manifest
  - fiveqln_validate_research_prompt
  - fiveqln_fractal_memory
  - fiveqln_create_skill_manifest
  - fiveqln_verify_skill
provides_hooks:
  - pre_llm_call
